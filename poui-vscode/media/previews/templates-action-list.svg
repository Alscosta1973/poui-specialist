<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <!-- Background -->
  <rect width="800" height="480" fill="#1a1a1a"/>

  <!-- Toolbar -->
  <rect width="800" height="52" fill="#2c6fad"/>
  <text x="20" y="33" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Títulos a Pagar</text>

  <!-- Page body (dimmed — modal open) -->
  <rect x="0" y="52" width="800" height="428" fill="#1e1e1e"/>

  <!-- Table header (behind modal) -->
  <rect x="16" y="72" width="768" height="36" rx="3" fill="#252525" opacity="0.5"/>
  <text x="30"  y="95" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Título</text>
  <text x="150" y="95" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Fornecedor</text>
  <text x="420" y="95" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Vencimento</text>
  <text x="560" y="95" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Valor</text>
  <text x="690" y="95" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Ação</text>

  <!-- Row 1 (behind, dimmed) -->
  <rect x="16" y="108" width="768" height="38" fill="#1e1e1e" opacity="0.5"/>
  <text x="30"  y="132" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">TP0001</text>
  <text x="150" y="132" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">Fornecedor Alpha</text>
  <text x="420" y="132" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">15/03/2026</text>
  <text x="560" y="132" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">R$ 1.250,00</text>
  <rect x="672" y="115" width="80" height="24" rx="3" fill="#2c6fad" opacity="0.4"/>
  <text x="712" y="131" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle" opacity="0.6">Baixar</text>

  <!-- Row 2 (behind, dimmed, already processed) -->
  <rect x="16" y="146" width="768" height="38" fill="#222" opacity="0.5"/>
  <text x="30"  y="170" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">TP0002</text>
  <text x="150" y="170" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">Fornecedor Beta</text>
  <text x="420" y="170" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">18/03/2026</text>
  <text x="560" y="170" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">R$ 890,00</text>
  <text x="700" y="170" fill="#4caf50" font-family="Segoe UI,Arial,sans-serif" font-size="12" opacity="0.6">✓ Baixado</text>

  <!-- Row 3 (behind, dimmed) -->
  <rect x="16" y="184" width="768" height="38" fill="#1e1e1e" opacity="0.5"/>
  <text x="30"  y="208" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">TP0003</text>
  <text x="150" y="208" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">Fornecedor Gama</text>
  <text x="420" y="208" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">22/03/2026</text>
  <text x="560" y="208" fill="#444" font-family="Segoe UI,Arial,sans-serif" font-size="13">R$ 3.400,00</text>
  <rect x="672" y="191" width="80" height="24" rx="3" fill="#2c6fad" opacity="0.4"/>
  <text x="712" y="207" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle" opacity="0.6">Baixar</text>

  <!-- Backdrop overlay -->
  <rect width="800" height="480" fill="black" opacity="0.6"/>

  <!-- Confirmation modal -->
  <rect x="220" y="130" width="360" height="200" rx="8" fill="#242424" stroke="#353535" stroke-width="1"/>

  <!-- Modal header -->
  <rect x="220" y="130" width="360" height="52" rx="8" fill="#2a2a2a"/>
  <rect x="220" y="162" width="360" height="20" fill="#2a2a2a"/>
  <text x="242" y="162" fill="#e0e0e0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Confirmar Baixa</text>
  <line x1="220" y1="182" x2="580" y2="182" stroke="#353535" stroke-width="1"/>

  <!-- Modal body: interpolated field values -->
  <text x="242" y="210" fill="#aaa" font-family="Segoe UI,Arial,sans-serif" font-size="13">Confirma a baixa do título</text>
  <text x="242" y="230" fill="#e0e0e0" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">TP0001 — Fornecedor Alpha</text>
  <text x="242" y="250" fill="#aaa" font-family="Segoe UI,Arial,sans-serif" font-size="13">no valor de</text>
  <text x="330" y="250" fill="#4caf50" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">R$ 1.250,00</text>
  <text x="242" y="250" fill="#aaa" font-family="Segoe UI,Arial,sans-serif" font-size="13" opacity="0"> </text>
  <text x="242" y="266" fill="#666" font-family="Segoe UI,Arial,sans-serif" font-size="11">?</text>

  <!-- Modal footer -->
  <line x1="220" y1="280" x2="580" y2="280" stroke="#353535" stroke-width="1"/>
  <rect x="400" y="288" width="70" height="30" rx="4" fill="transparent" stroke="#353535" stroke-width="1"/>
  <text x="435" y="308" fill="#aaa" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">Cancelar</text>
  <rect x="480" y="288" width="80" height="30" rx="4" fill="#2c6fad"/>
  <!-- Loading spinner arc on confirm button -->
  <circle cx="493" cy="303" r="7" fill="none" stroke="white" stroke-width="2" stroke-dasharray="28 44" stroke-linecap="round"/>
  <text x="530" y="308" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Confirmar</text>

  <!-- Partial-success result toast (bottom) -->
  <rect x="16" y="428" width="330" height="36" rx="4" fill="#242424" stroke="#4caf50" stroke-width="1"/>
  <text x="32" y="451" fill="#4caf50" font-family="Segoe UI,Arial,sans-serif" font-size="12">✓ 2 de 3 títulos baixados — 1 falhou</text>
</svg>
